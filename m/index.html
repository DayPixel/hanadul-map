<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>하나둘 지도</title>
  <meta name="description" content="하나둘에서 공유한 장소 모음이에요. 앱에서 한 번에 내 지도에 담을 수 있어요.">
  <meta property="og:title" content="하나둘 공유 지도">
  <meta property="og:description" content="SNS에서 본 장소들을 모아 둔 지도예요. 하나둘에서 한 번에 담아 보세요.">
  <meta property="og:image" content="https://map.daypixel.kr/og.png">
  <meta name="apple-itunes-app" content="app-id=6812646676">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/icon.png">
  <style>
    :root { --bg: #F7F7FA; --surface: #FFFFFF; --text: #1B1A22; --muted: #5C5A68; --line: rgba(27,26,34,0.10); --accent: #5B50F0; --on-accent: #FFFFFF; --soft: #EEEDFF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0D0C11; --surface: #1A1920; --text: #F3F2F8; --muted: #B5B2C2; --line: rgba(243,242,248,0.13); --accent: #8C84FF; --on-accent: #120F1F; --soft: rgba(140,132,255,0.14); } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px calc(120px + env(safe-area-inset-bottom)); }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .brand img { width: 24px; height: 24px; border-radius: 6px; }
    h1 { font-size: 28px; line-height: 1.25; margin: 16px 0 4px; word-break: keep-all; }
    .summary { color: var(--muted); margin: 0 0 20px; }
    ol { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; }
    li { display: flex; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    .num { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--soft); color: var(--accent); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
    .body { min-width: 0; flex: 1; }
    .name { font-weight: 600; word-break: keep-all; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 14px; }
    .links { display: flex; gap: 14px; margin-top: 4px; font-size: 14px; }
    .links a { color: var(--accent); text-decoration: none; font-weight: 600; min-height: 32px; display: inline-flex; align-items: center; }
    .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
    .cta-inner { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
    .primary { display: flex; justify-content: center; align-items: center; min-height: 50px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; font-size: 17px; }
    .secondary { text-align: center; color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; min-height: 32px; display: flex; align-items: center; justify-content: center; }
    .state { text-align: center; color: var(--muted); padding: 48px 0; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/icon.png" alt="" width="24" height="24">하나둘</div>
    <h1 id="title">공유 지도</h1>
    <p class="summary" id="summary">불러오는 중이에요…</p>
    <ol id="list" hidden></ol>
    <p class="state" id="state" hidden></p>
  </main>
  <div class="cta">
    <div class="cta-inner">
      <a class="primary" id="open-app" href="#">하나둘에서 내 지도에 담기</a>
      <a class="secondary" id="install" href="https://apps.apple.com/kr/app/id6812646676?ct=shared_map">아직 앱이 없나요? App Store에서 받기</a>
    </div>
  </div>
  <script>
    (function () {
      var SUPABASE_URL = 'https://vsbmjqyzzagrembavshz.supabase.co';
      var PUBLISHABLE_KEY = 'sb_publishable_0zkkkU8oKbshZ3dTJakiJw_sehGTq9E';
      var token = new URLSearchParams(location.search.replace(/%0[ad]/gi, '')).get('c') || '';
      var $ = function (id) { return document.getElementById(id); };
      function fail(message) { $('summary').textContent = ''; $('state').hidden = false; $('state').textContent = message; $('open-app').href = 'https://apps.apple.com/kr/app/id6812646676?ct=shared_map_missing'; $('open-app').textContent = '하나둘 앱 받기'; $('install').hidden = true; }
      if (!/^[a-f0-9]{32}$/.test(token)) return fail('링크가 올바르지 않아요. 공유받은 주소를 다시 확인해 주세요.');
      // Custom scheme for users who already installed the app (in-app browsers often ignore universal links).
      $('open-app').href = 'mappin://m?c=' + token;
      fetch(SUPABASE_URL + '/rest/v1/rpc/get_place_share', {
        method: 'POST', headers: { apikey: PUBLISHABLE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token })
      }).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (data) {
        if (!data || !Array.isArray(data.places)) return fail('공유가 중지되었거나 없는 지도예요.');
        document.title = data.name + ' · 하나둘 지도';
        $('title').textContent = data.name;
        $('summary').textContent = data.places.length + '곳 · 하나둘에서 한 번에 담을 수 있어요';
        var list = $('list');
        data.places.forEach(function (place, index) {
          var li = document.createElement('li');
          var num = document.createElement('span'); num.className = 'num'; num.textContent = String(index + 1);
          var body = document.createElement('div'); body.className = 'body';
          var name = document.createElement('div'); name.className = 'name'; name.textContent = place.name;
          body.appendChild(name);
          var meta = [place.category, place.area].filter(Boolean).join(' · ');
          if (meta) { var m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; body.appendChild(m); }
          var links = document.createElement('div'); links.className = 'links';
          var query = [place.name, place.area].filter(Boolean).join(' ');
          var naver = /^https:\/\/map\.naver\.com\/p\/entry\/place\/[1-9][0-9]{0,30}$/.test(place.naverUrl || '') ? place.naverUrl : 'https://map.naver.com/p/search/' + encodeURIComponent(place.name);
          links.appendChild(link('네이버 지도', naver));
          if (/^[A-Za-z0-9_-]{1,255}$/.test(place.googlePlaceId || '')) links.appendChild(link('Google 지도', 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query) + '&query_place_id=' + place.googlePlaceId));
          body.appendChild(links);
          li.appendChild(num); li.appendChild(body); list.appendChild(li);
        });
        list.hidden = data.places.length === 0;
        if (!data.places.length) fail('아직 담긴 장소가 없어요.');
      }).catch(function () { fail('지도를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'); });
      function link(label, href) { var a = document.createElement('a'); a.textContent = label; a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a; }
    })();
  </script>
</body>
</html>
